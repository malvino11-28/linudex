# Linudex Termux configuration

# Use volume keys as extra keys modifier
# volume-keys = volume

# Extra keyboard row
extra-keys = [['ESC','CTRL','ALT','TAB','LEFT','DOWN','UP','RIGHT']]

# Terminal behavior
terminal-transcript-rows = 5000

# Keep keyboard behavior predictable with external keyboards
enforce-char-based-input = true

# Open new Termux sessions in the same working directory
default-working-directory = /data/data/com.termux/files/home